<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#386a52"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Моё питание"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><title>Моё питание</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20372b;background:#f5f7f3}*{box-sizing:border-box}body{margin:0}header{background:#386a52;color:white;padding:22px 18px 15px}h1{font-size:23px;margin:0}h2{font-size:18px;margin:14px 0}h3{font-size:15px;margin:8px 0}.sub{font-size:12px;opacity:.85;margin-top:4px}.wrap{max-width:780px;margin:auto;padding:12px 14px 110px}.tabs{display:flex;gap:6px;overflow:auto;padding:8px 0 12px;position:sticky;top:0;background:#f5f7f3;z-index:2}.tabs button{white-space:nowrap}.tabs button.active,.days button.active{background:#386a52;color:white}.card{background:white;border:1px solid #dbe5da;border-radius:15px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #00000006}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.item{border-top:1px solid #e7ece6;padding:10px 0}.item:first-child{border:0}.muted{color:#65766b;font-size:12px}.btn,button{font:inherit;border:1px solid #cdd9cd;border-radius:10px;padding:9px 11px;background:white;color:#244631;cursor:pointer}.btn.primary{background:#386a52;color:white;border-color:#386a52}.btn.small{padding:5px 9px;font-size:12px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.days button{padding:10px 0;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.metric{background:#eaf1e9;border-radius:10px;text-align:center;padding:10px 3px}.metric b{font-size:17px}.metric small{display:block;font-size:10px;color:#597061}.bar{height:5px;border-radius:5px;background:#cddccf;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:#386a52}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid #cdd9cd;border-radius:9px;background:white;color:#20372b;min-width:0}input[type=checkbox]{width:19px;height:19px;accent-color:#386a52}input[type=range]{accent-color:#386a52}.pill{font-size:12px;margin:3px;padding:8px}.pill.on{background:#d6e8d9;border-color:#386a52}.note{font-size:12px;color:#65766b;line-height:1.5}.error{color:#a32626;font-size:12px}.success{color:#386a52;font-size:12px}label{font-size:12px;color:#51695a;display:block;margin:7px 0 4px}footer{position:fixed;bottom:0;left:0;right:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#f5f7f3;border-top:1px solid #dbe5da;text-align:center;font-size:11px;color:#65766b}@media(min-width:700px){.wrap{padding-bottom:70px}.tabs{justify-content:center}} 
</style></head><body><header><h1>🥗 Моё питание</h1><div class="sub">Меню · дневник КБЖУ · конструктор · покупки · морозилка</div></header><main class="wrap"><nav class="tabs" id="tabs"></nav><div id="view"></div></main><footer>Данные хранятся на этом устройстве · регулярно делай резервную копию</footer>
<script>
"use strict";
const FOOD={
chicken:["Куриное филе сырое",110,23,1.5,0],turkey:["Фарш индейки",140,20,6,0],beef:["Говядина нежирная",145,21,6,0],eggplant:["Баклажан",25,1,0.2,6],tomato:["Помидоры",18,0.9,0.2,3.9],broccoli:["Брокколи",34,2.8,0.4,7],potato:["Картофель",77,2,0.1,17],onion:["Лук",40,1.1,0.1,9],zucchini:["Кабачок",17,1.2,0.3,3.1],mushroom:["Грибы",22,3,0.3,3.3],carrot:["Морковь",41,0.9,0.2,10],cheese:["Твёрдый сыр",370,25,30,1],buckwheat:["Гречка варёная",110,3.6,1.1,21],rice:["Рис варёный",130,2.7,0.3,28],bread:["Багет",280,9,1.5,57],oil:["Оливковое масло",884,0,100,0],egg:["Яйцо варёное",155,13,11,1],tuna:["Тунец в собственном соку",110,25,1,0],beans:["Фасоль варёная",110,7,0.5,18],curd:["Творог 9%",160,16,9,3],milk:["Молоко",62,3.2,3.5,4.7],fruit:["Фрукты (среднее)",55,0.5,0.2,13],berries:["Ягоды (среднее)",45,0.7,0.3,10],veg:["Свежие овощи (среднее)",25,1.2,0.2,4.5],crumbs:["Панировочные сухари",350,12,5,70]
};
const REC={
cutlet:{name:"Куриная отбивная",serves:2,parts:{chicken:400,egg:50,crumbs:40,oil:15}},
boat:{name:"Баклажанные лодочки",serves:2,parts:{eggplant:600,chicken:300,tomato:200,cheese:60,oil:20}},
turkeyballs:{name:"Котлеты из индейки",serves:2,parts:{turkey:450,zucchini:200,onion:70,egg:50,oil:10}},
stew:{name:"Говядина с грибами",serves:2,parts:{beef:400,mushroom:300,onion:100,carrot:100,tomato:150,oil:15}},
soup:{name:"Суп-пюре брокколи",serves:3,parts:{broccoli:700,potato:250,onion:100,oil:15}},
tunasalad:{name:"Салат с тунцом",serves:1,parts:{tuna:120,egg:100,beans:120,veg:250,oil:10}},
eggsalad:{name:"Салат с яйцом и фасолью",serves:1,parts:{egg:100,beans:150,cheese:40,veg:300,oil:10}}
};
const WEEK=[
[[["cutlet",1],["buckwheat",180],["veg",250],["oil",10]],[["soup",1],["bread",60],["cheese",30],["egg",100]],[["curd",180],["fruit",150],["milk",250]]],
[[["boat",1],["bread",60]],[["tunasalad",1]],[["curd",150],["berries",150],["fruit",150],["milk",250]]],
[[["turkeyballs",1],["rice",180],["veg",250],["oil",10]],[["soup",1],["bread",60],["cheese",30],["egg",100]],[["curd",180],["fruit",160],["milk",250]]],
[[["stew",1],["buckwheat",180],["veg",200],["oil",10]],[["eggsalad",1],["bread",40]],[["curd",150],["fruit",150],["milk",250]]],
[[["cutlet",1],["rice",180],["veg",250],["oil",10]],[["soup",1],["bread",60],["cheese",30],["egg",100]],[["curd",180],["berries",150],["milk",250]]],
[[["boat",1],["bread",60]],[["turkeyballs",1],["buckwheat",180],["veg",250],["oil",10]],[["curd",150],["fruit",150],["milk",250]]],
[[["stew",1],["rice",180],["veg",250],["oil",10]],[["tunasalad",1],["bread",60]],[["curd",150],["fruit",150],["milk",250]]]
];
const SHOP=[["Мясо и рыба",[["Куриное филе","около 1 кг"],["Фарш индейки","500 г"],["Говядина","500 г"],["Тунец","2 банки"]]],["Овощи и фрукты",[["Баклажаны","2 крупных"],["Брокколи","700–900 г"],["Помидоры и салатные овощи","2,5 кг"],["Грибы","300 г"],["Картофель, лук, морковь, кабачок","около 1 кг"],["Фрукты и ягоды","около 2 кг"]]],["Молочное и яйца",[["Творог 9%","1,2 кг"],["Сыр","250 г"],["Молоко","2 л"],["Яйца","14 шт."]]],["Прочее",[["Гречка","250 г сухой"],["Рис","250 г сухой"],["Багет","2–3 шт."],["Фасоль","2 банки"],["Панировка","1 упаковка"],["Масло и специи","по необходимости"]]]];
const PREP=["Подготовить куриные отбивные и заморозить порционно","Запечь баклажанные лодочки","Приготовить котлеты из индейки","Потушить говядину с грибами","Сварить гречку и рис, быстро охладить","Приготовить суп-пюре","Нарезать багет порционно","Упаковать, подписать даты и убрать в морозилку"];
const KEY="moe-pitanie-v1";
function fresh(){return {diary:{},menuExtra:{},customFood:{},inventory:[],shoppingDone:[],prepDone:[],weight:[],goals:[1700,105,60,185]}}
let data;try{data=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch{data=fresh()}
let tab="menu",date=localDate(),goal=500,builderMode="recipe",chosen="boat",selected=new Set(["chicken","eggplant","tomato","cheese","oil"]),builderParts=null,notice="";
function localDate(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function esc(s){return String(s).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){notice="Не удалось сохранить: проверь свободное место или режим браузера."}}
function allFood(){return {...FOOD,...data.customFood}}
function nutrient(parts){let a=[0,0,0,0],f=allFood();Object.entries(parts).forEach(([id,g])=>{if(!f[id])return;for(let i=0;i<4;i++)a[i]+=f[id][i+1]*g/100});return a}
function sum(items){let t=[0,0,0,0];items.forEach(x=>nutrient(x.parts).forEach((n,i)=>t[i]+=n));return t}
function fmt(t){return `${Math.round(t[0])} ккал · Б ${Math.round(t[1])} · Ж ${Math.round(t[2])} · У ${Math.round(t[3])} г`}
function recipeItem(id,m=1){let r=REC[id];return {name:r.name,parts:Object.fromEntries(Object.entries(r.parts).map(([k,g])=>[k,g*m/r.serves]))}}
function item(id,g){return REC[id]?recipeItem(id,g):{name:allFood()[id]?.[0]||id,parts:{[id]:g}}}
function itemsForDay(){let d=new Date(date+"T12:00:00"),weekday=(d.getDay()+6)%7;return WEEK[weekday]}
function arr(k){return data[k][date]||(data[k][date]=[])}
function btn(label,action,cls=""){return `<button class="btn ${cls}" data-action="${action}">${label}</button>`}
function dateBar(){return `<div class="row"><button class="btn small" data-action="prev">←</button><input aria-label="Дата" id="date" type="date" value="${date}"><button class="btn small" data-action="next">→</button></div>`}
function render(){document.getElementById("tabs").innerHTML=[["menu","📅 Меню"],["diary","📊 Дневник"],["builder","✨ Конструктор"],["shop","🛒 Покупки"],["prep","🍳 Готовка"],["stock","❄️ Морозилка"],["settings","⚙️ Данные"]].map(([id,n])=>`<button class="${tab===id?"active":""}" data-action="tab:${id}">${n}</button>`).join("");document.getElementById("view").innerHTML=(notice?`<div class="card success">${esc(notice)}</div>`:"")+({menu:menuView,diary:diaryView,builder:builderView,shop:shopView,prep:prepView,stock:stockView,settings:settingsView}[tab])()}
function menuView(){let h=dateBar()+"<h2>План питания</h2>";itemsForDay().forEach((meal,i)=>{let list=meal.map(([id,g])=>item(id,g));h+=`<div class="card"><div class="row"><h3>${["Первый приём","Второй приём","Третий приём"][i]}</h3><span class="muted">${Math.round(sum(list)[0])} ккал</span></div>`;list.forEach(x=>h+=`<div class="row item"><span>${esc(x.name)}</span><span class="muted">${fmt(nutrient(x.parts))}</span></div>`);h+=btn("Отметить весь приём съеденным","meal:"+i,"primary")+"</div>"});if(arr("menuExtra").length){h+="<h3>Добавлено в меню</h3>";arr("menuExtra").forEach((x,i)=>h+=`<div class="card row"><div>${esc(x.name)}<div class="muted">${fmt(nutrient(x.parts))}</div></div><div>${btn("Съела","eatExtra:"+i,"small")}${btn("×","deleteExtra:"+i,"small")}</div></div>`)}return h+`<p class="note">Меню примерное. Для домашних блюд значения рассчитаны по ингредиентам, а не по измеренному весу готовой порции.</p>`}
function diaryView(){let entries=arr("diary"),t=sum(entries),targets=data.goals;let h=dateBar()+"<h2>Что съела</h2><div class='metrics'>";["Ккал","Белки","Жиры","Углев."].forEach((name,i)=>h+=`<div class="metric"><small>${name}</small><b>${Math.round(t[i])}</b><small>из ${targets[i]}</small><div class="bar"><i style="width:${Math.min(100,t[i]/Math.max(1,targets[i])*100)}%"></i></div></div>`);h+=`</div><div class="card row"><span>До цели</span><b>${Math.round(targets[0]-t[0])} ккал</b></div>`;if(!entries.length)h+="<p class='note'>Пока нет записей. Отметь еду из меню или добавь продукт.</p>";entries.forEach((x,i)=>h+=`<div class="card"><div class="row"><b>${esc(x.name)}</b>${btn("Удалить","deleteDiary:"+i,"small")}</div><div class="muted">${fmt(nutrient(x.parts))}</div><div class="row" style="margin-top:8px"><span class="muted">Изменить размер порции</span>${btn("½","half:"+i,"small")}${btn("×2","double:"+i,"small")}</div></div>`);h+=`<div class="card"><h3>Добавить продукт</h3><label>Из справочника</label><select id="foodChoice">${Object.entries(allFood()).map(([id,f])=>`<option value="${esc(id)}">${esc(f[0])}</option>`).join("")}</select><label>Сколько съедено, г</label><input type="number" id="foodGrams" min="1" value="100">${btn("Добавить","addFood","primary")}</div><div class="card"><h3>Новый продукт по этикетке</h3><input id="newName" placeholder="Название"><label>Значения на 100 г</label><div class="grid2"><input id="newK" type="number" min="0" step="any" placeholder="Ккал"><input id="newP" type="number" min="0" step="any" placeholder="Белки"></div><div class="grid2" style="margin-top:8px"><input id="newF" type="number" min="0" step="any" placeholder="Жиры"><input id="newC" type="number" min="0" step="any" placeholder="Углеводы"></div><label>Съедено, г</label><input id="newG" type="number" min="1" value="100">${btn("Сохранить и добавить","newFood","primary")}</div>`;return h}
function currentParts(){let parts={};if(builderMode==="recipe"){let r=recipeItem(chosen);parts=r.parts}else{let presets={chicken:150,turkey:150,beef:150,eggplant:200,tomato:150,broccoli:200,cheese:30,oil:10,bread:60,egg:100,curd:150,rice:150,buckwheat:150};selected.forEach(id=>parts[id]=presets[id]||100)}let base=nutrient(parts)[0];if(!base)return null;return Object.fromEntries(Object.entries(parts).map(([id,g])=>[id,Math.max(1,Math.round(g*goal/base))]))}
function builderView(){let h=`<h2>Конструктор блюд</h2><div class="card"><div class="row"><span>Желаемая калорийность</span><b>${goal} ккал</b></div><input id="goal" type="range" min="200" max="900" step="25" value="${goal}"></div><div class="grid2">${btn("Готовые рецепты","mode:recipe",builderMode==="recipe"?"primary":"")}${btn("Мои продукты","mode:products",builderMode==="products"?"primary":"")}</div>`;if(builderMode==="recipe"){h+="<h3>Выбери блюдо</h3>";Object.entries(REC).forEach(([id,r])=>h+=`<div class="card row"><div><b>${esc(r.name)}</b><div class="muted">${Math.round(nutrient(recipeItem(id).parts)[0])} ккал базовая порция</div></div>${btn(chosen===id?"✓":"Выбрать","recipe:"+id,"small")}</div>`)}else{h+="<h3>Выбери ингредиенты</h3>";Object.entries(allFood()).forEach(([id,f])=>h+=`<button class="pill ${selected.has(id)?"on":""}" data-action="select:${esc(id)}">${selected.has(id)?"✓ ":""}${esc(f[0])}</button>`)}let parts=currentParts();if(parts){h+=`<div class="card"><h3>Подобранная порция</h3>`;Object.entries(parts).forEach(([id,g])=>h+=`<div class="row item"><span>${esc(allFood()[id][0])}</span><b>${g} г</b></div>`);h+=`<h3>${fmt(nutrient(parts))}</h3><div class="grid2">${btn("Добавить в дневник","saveBuilder:diary","primary")}${btn("Добавить в меню","saveBuilder:menu")}</div></div>`}else h+='<p class="note">Выбери хотя бы один продукт.</p>';return h+`<p class="note">Количество ингредиентов масштабируется математически. Это не AI-генерация рецептов: сочетаемость и способ приготовления нужно оценивать отдельно. Калорийность зависит от фактических продуктов и масла.</p>`}
function shopView(){let h="<h2>Список покупок</h2>";SHOP.forEach(([group,items],gi)=>{h+=`<div class="card"><h3>${group}</h3>`;items.forEach(([name,qty],i)=>{let key=gi+"-"+i;h+=`<label class="row item" style="font-size:14px"><input type="checkbox" style="width:20px" data-shop="${key}" ${data.shoppingDone.includes(key)?"checked":""}><span style="flex:1;${data.shoppingDone.includes(key)?"text-decoration:line-through":""}">${esc(name)}</span><span class="muted">${esc(qty)}</span></label>`});h+="</div>"});return h+'<p class="note">Базовый список для исходного недельного меню. Новые блюда из конструктора пока не пересчитывают покупки автоматически.</p>'}
function prepView(){return "<h2>Готовка на неделю</h2><div class='card'>"+PREP.map((s,i)=>`<label class="row item" style="font-size:14px"><input type="checkbox" style="width:20px" data-prep="${i}" ${data.prepDone.includes(i)?"checked":""}><span style="flex:1;${data.prepDone.includes(i)?"text-decoration:line-through":""}">${esc(s)}</span></label>`).join("")+"</div><p class='note'>Готовые блюда быстро охлаждай и замораживай порциями. Не оставляй приготовленную еду при комнатной температуре надолго.</p>"}
function stockView(){let h=`<h2>Моя морозилка</h2><div class="card"><label>Блюдо</label><select id="stockRecipe">${Object.entries(REC).map(([id,r])=>`<option value="${id}">${esc(r.name)}</option>`).join("")}</select><div class="grid2"><div><label>Количество порций</label><input type="number" id="stockCount" min="1" value="2"></div><div><label>Дата приготовления</label><input type="date" id="stockDate" value="${localDate()}"></div></div><div style="margin-top:10px">${btn("Добавить в морозилку","addStock","primary")}</div></div>`;if(!data.inventory.length)h+='<p class="note">Пока пусто.</p>';data.inventory.forEach((x,i)=>h+=`<div class="card row"><div><b>${esc(x.name)}</b><div class="muted">${x.count} порц. · ${esc(x.date)}</div></div><div>${btn("−1","takeStock:"+i,"small")}${btn("×","removeStock:"+i,"small")}</div></div>`);return h}
function settingsView(){let h=`<h2>Настройки и сохранение</h2><div class="card"><h3>Цели на день</h3><div class="grid2">${["Калории","Белки, г","Жиры, г","Углеводы, г"].map((x,i)=>`<div><label>${x}</label><input id="target${i}" type="number" min="1" value="${data.goals[i]}"></div>`).join("")}</div><div style="margin-top:10px">${btn("Сохранить цели","targets","primary")}</div></div><div class="card"><h3>Резервная копия</h3><p class="note">Экспортируй данные в JSON и сохрани в «Файлы» на iPhone. При смене телефона или очистке Safari импортируй копию.</p><div class="grid2">${btn("Скачать копию","export","primary")}${btn("Импортировать","import")}</div><input id="importFile" type="file" accept=".json,application/json" style="display:none"></div><div class="card"><h3>История веса</h3><div class="grid2"><input type="date" id="weightDate" value="${localDate()}"><input type="number" id="weightValue" min="20" max="400" step="0.1" placeholder="Вес, кг"></div><div style="margin-top:8px">${btn("Добавить вес","addWeight","primary")}</div>${data.weight.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15).map(x=>`<div class="row item"><span>${esc(x.date)}</span><b>${x.kg} кг</b></div>`).join("")}</div>`;return h}
function numeric(id){let x=document.getElementById(id)?.value;return x===""||x==null?NaN:Number(x)}
function addDiary(x){arr("diary").push(JSON.parse(JSON.stringify(x)));save()}
function act(action){let [cmd,val]=action.split(":");notice="";if(cmd==="tab")tab=val;
if(cmd==="prev"||cmd==="next"){let d=new Date(date+"T12:00:00");d.setDate(d.getDate()+(cmd==="prev"?-1:1));date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
if(cmd==="meal"){itemsForDay()[Number(val)].forEach(([id,g])=>addDiary(item(id,g)));tab="diary"}
if(cmd==="eatExtra"){addDiary(arr("menuExtra")[Number(val)]);tab="diary"}
if(cmd==="deleteExtra"){arr("menuExtra").splice(Number(val),1);save()}
if(cmd==="deleteDiary"){arr("diary").splice(Number(val),1);save()}
if(cmd==="half"||cmd==="double"){let x=arr("diary")[Number(val)];x.parts=Object.fromEntries(Object.entries(x.parts).map(([id,g])=>[id,g*(cmd==="half"?.5:2)]));save()}
if(cmd==="addFood"){let id=document.getElementById("foodChoice").value,g=numeric("foodGrams");if(!(g>0)){alert("Укажи граммы.");return}addDiary(item(id,g))}
if(cmd==="newFood"){let name=document.getElementById("newName").value.trim(),g=numeric("newG"),nums=["newK","newP","newF","newC"].map(numeric);if(!name||!(g>0)||nums.some(x=>!Number.isFinite(x)||x<0)){alert("Заполни название, граммы и все четыре значения КБЖУ.");return}let id="custom_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);data.customFood[id]=[name,...nums];addDiary(item(id,g))}
if(cmd==="mode")builderMode=val;
if(cmd==="recipe")chosen=val;
if(cmd==="select"){selected.has(val)?selected.delete(val):selected.add(val)}
if(cmd==="saveBuilder"){let parts=currentParts();if(!parts)return;let name=builderMode==="recipe"?REC[chosen].name:"Моя комбинация продуктов",x={name,parts};if(val==="diary"){addDiary(x);tab="diary"}else{arr("menuExtra").push(x);save();tab="menu"}notice="Блюдо добавлено."}
if(cmd==="addStock"){let id=document.getElementById("stockRecipe").value,count=numeric("stockCount"),dt=document.getElementById("stockDate").value;if(!(count>0)||!dt){alert("Укажи порции и дату.");return}data.inventory.push({name:REC[id].name,id,count:Math.round(count),date:dt});save()}
if(cmd==="takeStock"){let x=data.inventory[Number(val)];x.count--;if(x.count<=0)data.inventory.splice(Number(val),1);save()}
if(cmd==="removeStock"){data.inventory.splice(Number(val),1);save()}
if(cmd==="targets"){let t=[0,1,2,3].map(i=>numeric("target"+i));if(t.some(x=>!Number.isFinite(x)||x<=0)){alert("Проверь цели.");return}data.goals=t;save()}
if(cmd==="addWeight"){let dt=document.getElementById("weightDate").value,kg=numeric("weightValue");if(!dt||!(kg>=20&&kg<=400)){alert("Укажи дату и вес.");return}data.weight=data.weight.filter(x=>x.date!==dt);data.weight.push({date:dt,kg});save()}
if(cmd==="export"){let blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),data},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="moe-pitanie-backup-"+localDate()+".json";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);notice="Резервная копия подготовлена для сохранения."}
if(cmd==="import"){document.getElementById("importFile").click();return}
render()}
document.getElementById("tabs").addEventListener("click",e=>{let b=e.target.closest("[data-action]");if(b)act(b.dataset.action)});
document.getElementById("view").addEventListener("click",e=>{let b=e.target.closest("[data-action]");if(b)act(b.dataset.action)});
document.getElementById("view").addEventListener("change",e=>{let el=e.target;if(el.id==="date"){date=el.value;render()}if(el.id==="goal"){goal=Number(el.value);render()}if(el.dataset.shop!==undefined){let k=el.dataset.shop;data.shoppingDone=el.checked?[...new Set([...data.shoppingDone,k])]:data.shoppingDone.filter(x=>x!==k);save();render()}if(el.dataset.prep!==undefined){let k=Number(el.dataset.prep);data.prepDone=el.checked?[...new Set([...data.prepDone,k])]:data.prepDone.filter(x=>x!==k);save();render()}if(el.id==="importFile"&&el.files[0]){let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(obj.version!==1||!obj.data||typeof obj.data!=="object"||!obj.data.diary||!obj.data.customFood)throw Error("Формат");if(confirm("Заменить текущие данные данными из резервной копии?")){data=Object.assign(fresh(),obj.data);save();notice="Данные восстановлены.";render()}}catch{alert("Не удалось прочитать резервную копию.")}};reader.readAsText(el.files[0])}});
document.getElementById("view").addEventListener("input",e=>{if(e.target.id==="goal"){goal=Number(e.target.value);render()}});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("./sw.js").catch(()=>{});
render();
</script></body></html>
